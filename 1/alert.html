<!-- 3. Write a program which displays some alert message using bootstrap
background color classes for each message. Display at least 5 alert messages.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Alerts</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Bootstrap Alert Messages</h2>

        <div class="alert alert-primary">
            This is a primary alert message!
        </div>

        <div class="alert alert-success">
            Success! Your operation was completed successfully.
        </div>

        <div class="alert alert-danger">
            Error! Something went wrong.
        </div>

        <div class="alert alert-warning">
            Warning! Please check your information.
        </div>

        <div class="alert alert-info">
            Information! Welcome to our website.
        </div>

        <div class="alert alert-secondary">
            This is a secondary alert message.
        </div>

    </div>

</body>
</html>
