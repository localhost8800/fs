<!--1. Write a program using appropriate Bootstrap image classes that displays
image in following different shapes :
a. Circle
b. Thumbnail
c. Responsive Image-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Images</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h2 class="text-center mb-4">Bootstrap Image Shapes</h2>

        <h4>1. Rounded Circle Image</h4>
        <img src="images/1.jpg"
             class="rounded-circle"
             width="200"
             height="200"
             alt="Circle Image">

        <hr>

        <h4>2. Thumbnail Image</h4>
        <img src="images/2.jpg"
             class="img-thumbnail"
             width="200"
             alt="Thumbnail Image">

        <hr>

        <h4>3. Responsive Image</h4>
        <img src="images/3.jpg"
             class="img-fluid"
             alt="Responsive Image">

    </div>

</body>
</html>
