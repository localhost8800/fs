
<!DOCTYPE html>
<html>
<head>
    <title>All Customer Details</title>
</head>
<body>
    <h2>All Customer Details</h2>

    <table border="1" cellpadding="10">
        <tr>
            <th>Customer Name</th>
            <th>Email</th>
            <th>Mobile Number</th>
            <th>Address</th>
            <th>Pincode</th>
        </tr>

        {% for c in customers %}
        <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.email }}</td>
            <td>{{ c.mob }}</td>
            <td>{{ c.address }}</td>
            <td>{{ c.pincode }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">Add Another Customer</a>
</body>
</html>
